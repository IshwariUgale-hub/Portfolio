<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="style.css">

</head>

<body>
  
    <nav class="navbar navbar-expand-lg custom-navbar fixed-top" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">IU</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link fancy-link" href="#home">
                            <span>Home</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fancy-link" href="#">
                            <span>About</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fancy-link" href="#">
                            <span>Skills</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fancy-link" href="#">
                            <span>Projects</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fancy-link" href="#">
                            <span>Contact</span>
                        </a>
                    </li>


                </ul>

            </div>
        </div>
    </nav>

    <section class="Home-section" id="home">
        <div class="container">
            <div class="row align-items-center justify-content-center text-center mt-5 ms-5">
                <div class="col-md-6 text-center text-md-start ">
                    <h1 class="display-4 text-center"> Ishwari Ugale</h1>
                    <p class="lead text-center">A passionate developer with a love for creating innovative solutions.
                    </p>
                    <div class="card mt-5 justify-content-center align-items-center">
                        <div class="loader">
                            <p>Specializing in</p>
                            <div class="words">
                                <span class="word">Web Developing</span>
                                <span class="word">Data Analysis</span>
                                <span class="word">Artificial Intelligence</span>
                                <span class="word">Machine Learning</span> 
                            </div>
                        </div>
                    </div>

                </div>
                <div class="col-md-6 text-center">
                    <img src="Images/ishwari.jpeg" alt="Profile Picture" class="img-fluid rounded-circle">
                </div>
            </div>
        </div>


    </section>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <script>
        window.addEventListener("scroll", function () {
            const navbar = document.querySelector(".custom-navbar");

            if (window.scrollY > 50) {
                navbar.classList.add("scrolled");
            } else {
                navbar.classList.remove("scrolled");
            }
        });
    </script>


</body>

</html>
