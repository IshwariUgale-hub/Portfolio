    <script>
        /* ── Navbar scroll shrink ── */
        window.addEventListener("scroll", () => {
            const navbar = document.querySelector(".custom-navbar");
            navbar.classList.toggle("scrolled", window.scrollY > 50);
        });

        /* ── Cursor particle canvas ── */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        document.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            for (let i = 0; i < 3; i++) {
                particles.push({
                    x: mouse.x + (Math.random() - 0.5) * 10,
                    y: mouse.y + (Math.random() - 0.5) * 10,
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: (Math.random() - 0.5) * 1.2 - 0.4,
                    life: 1,
                    r: Math.random() * 2 + 0.5,
                    hue: Math.random() > 0.5 ? '187,158,253' : '150,130,240'
                });
            }
        });

        function drawBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            /* soft cursor glow */
            const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 240);
            g.addColorStop(0, 'rgba(187,158,253,0.07)');
            g.addColorStop(1, 'transparent');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            /* particles */
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${p.hue},${p.life * 0.55})`;
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.022;
            });

            requestAnimationFrame(drawBg);
        }
        drawBg();
    </script>
